teleop_twist_joy_node:
  ros__parameters:
    # 右スティック上下で前進/後退
    axis_linear:
      x: 4
    scale_linear:
      x: 0.5
    scale_linear_turbo:
      x: 1.5

    # 右スティック左右で回転
    axis_angular:
      yaw: 3
    scale_angular:
      yaw: 0.4

    # R2ボタンを押したときのみ有効
    enable_button: 7   # 多くのコントローラでは axes[5] = R2、もしくはボタン番号 7
    enable_turbo_button: -1  # ターボ不要

    # 重要: ボタンを離した時に必ずチェックを入れ、速度0を送信しやすくする
    require_enable_button: true

    # 重要: スティックやボタンの状態を20Hz（1秒に20回）で常に配信し続ける
    # これにより、離した瞬間に「0」というデータが送信されます
    autorepeat_rate: 10.0

    # 追加: cmd_velパブリッシュ頻度制限
    # autorepeat_rate: 1.0  # 1Hz -> 1秒に1回だけcmd_velを送信